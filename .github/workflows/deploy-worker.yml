name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

# The account id is not a credential — it only saves a second repository secret.
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '4cf322887ad576fc8f22792481d9e076' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The token is handed to the two steps that need it and to nothing else. At
    # job level it would also be in the environment of `npm ci` and
    # `npm run build`, where any dependency's install script could read it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # A missing token skips the deploy with a notice instead of failing the
      # build, so a repository that only publishes Pages stays green.
      - name: Check for a Cloudflare API token
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Worker deploy skipped::CLOUDFLARE_API_TOKEN is not set, so the Worker was not redeployed."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy worker
        if: steps.creds.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
