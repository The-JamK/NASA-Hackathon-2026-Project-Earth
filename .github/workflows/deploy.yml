name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The deploy refreshes the fallback snapshot itself, so the site never needs a
  # push to stay current: the job rebuilds the data on the runner with the live
  # API and deploys that build. Daily keeps it within a day at six API calls a
  # run, against a 1,000-a-day allowance.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only on a schedule or a manual run: a push should not spend minutes of
      # runner time refetching six points, and the committed snapshot is fine
      # there.
      # The deploy must never depend on this. If the refresh fails for any
      # reason, `continue-on-error` lets the job carry on and ship the committed
      # snapshot, which is exactly what shipped before the schedule existed; the
      # timeout stops a hung dependency install from blocking the deploy.
      - name: Refresh the live snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/refresh-live
        with:
          username: ${{ secrets.METEOMATICS_USERNAME }}
          password: ${{ secrets.METEOMATICS_PASSWORD }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
