[project]
name = "earth-trend-detective-case-files"
version = "0.1.0"
description = "Signal & Noise — Earth System Trend Detective (NASA Space Apps 2026)"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "xarray>=2024.1",
  "requests>=2.32",
  "earthaccess>=0.12",
  "pillow>=13.0.0",
  "rasterio>=1.5.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
